[project]
name = "vitalis"
version = "1.0.0"
description = "Alternativa 3 – Sistema Logístico y de Despacho de Emergencias Médicas (Modelos de Simulación, UNINTEP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
